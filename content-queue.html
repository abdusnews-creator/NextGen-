
<!DOCTYPE html>
<html lang="en">
<head>
<!-- Trigger GitHub Pages redeploy after adding Settings page -->
<!-- Trigger Pages rebuild for privacy-settings-new.html duplicate -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">
<title>NextGen Content Queue</title>

<style>
:root{--bg:#0b1020;--panel:#141e32;--line:#35547e;--text:#eef3ff;--muted:#c5d9ff;--accent:#00BFFF}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;min-height:76px;padding:16px 22px;background:linear-gradient(110deg,#10213f,#173b70 58%,#102544);border-bottom:1px solid var(--line);box-shadow:0 5px 22px #0004}
.brand{display:flex;flex-direction:column;gap:4px;line-height:1.1}
.brand-name{font-size:26px;font-weight:800;letter-spacing:.75px;color:#f4f7ff}
.brand-name span{color:var(--accent)}
.tagline{font-size:12px;font-weight:700;letter-spacing:.2px;color:var(--muted)}
main{flex:1;min-height:45vh}
footer{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:16px 20px calc(16px + env(safe-area-inset-bottom));margin-top:auto;color:var(--muted);background:linear-gradient(110deg,#10213f,#173b70 58%,#102544);border-top:1px solid var(--line);font-size:13px;font-weight:700}
footer .credit{font-size:11px;font-weight:600;color:#d4e2ff;text-align:right}
@media(max-width:480px){header{padding:15px 16px}.brand-name{font-size:24px}footer{padding-left:14px;padding-right:14px;flex-direction:column;align-items:flex-start}.credit{text-align:left!important}}
</style>
<style>
/* NextGen Studio-inspired dashboard */
:root{color-scheme:dark}
body{background:#0f141b;color:#f1f5f9;font-family:Arial,Helvetica,sans-serif}
.studio-top{height:72px;padding:0 26px;background:linear-gradient(110deg,#07182c 0%,#0b2442 65%,#103b65 100%);border-bottom:1px solid #1675bd;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:20;box-shadow:0 5px 22px #0004}
.studio-menu{font-size:25px;color:#cbd5e1;background:transparent;border:0;padding:6px}
.studio-brand{display:flex;align-items:center;gap:10px;min-width:230px;font-size:22px;font-weight:700;color:#f8fafc}
.studio-mark{width:38px;height:27px;background:#ff0033;border-radius:8px;display:grid;place-items:center;color:white;font-size:16px}
.studio-search{height:42px;max-width:720px;flex:1;border-radius:28px;background:#202a36;border:1px solid #2d3948;color:#eef2f7;padding:0 18px;font-size:15px;outline:none}
.studio-search:focus{border-color:#6686b8}
.studio-top-right{display:flex;align-items:center;gap:20px;margin-left:auto;color:#bdc8d6}
.studio-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#2563eb;color:#fff;font-weight:700}
.studio-shell{display:flex;min-height:calc(100vh - 72px)}
.studio-nav{width:248px;flex-shrink:0;padding:16px 12px;background:#0e151d;border-right:1px solid #202b36}
.studio-channel{display:flex;gap:12px;align-items:center;padding:8px 10px 22px;margin-bottom:14px;border-bottom:1px solid #25303c}
.studio-channel-logo{width:54px;height:54px;border-radius:50%;background:#e7dfcb;color:#6e4b19;display:grid;place-items:center;font-size:23px;flex-shrink:0}
.studio-channel strong{display:block;font-size:13px;line-height:1.4}
.studio-channel small{display:block;color:#92a1b4;margin-top:4px;font-size:12px}
.studio-nav .studio-navbtn{display:flex;align-items:center;gap:14px;width:100%;min-width:0;padding:12px 14px;margin:3px 0;border:0;border-radius:9px;background:transparent;color:#c4cfdd;text-align:left;font-size:14px}
.studio-nav .studio-navbtn:hover{background:#1c2733}
.studio-nav .studio-navbtn.active{background:#382027;color:#fff;font-weight:700;box-shadow:inset 4px 0 #ff0033}
.studio-nav-icon{width:22px;text-align:center;font-size:18px}
.studio-main{padding:28px 26px 44px;flex:1;min-width:0;max-width:1700px;margin:0 auto}
.studio-pagehead{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:24px}
.studio-pagehead h2{font-size:28px;margin:0 0 7px;color:#f8fafc}
.studio-subtitle{margin:0;color:#9aaabd;font-size:14px}
.studio-period{background:#18222d;border:1px solid #293745;color:#e4ebf4;padding:12px 15px;border-radius:12px}
.studio-note{color:#e9c875;background:#29251b;border:1px solid #61512b;border-radius:10px;padding:11px 14px;font-size:12px;margin-bottom:18px}
.studio-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}
.studio-metric{background:#141d27;border:1px solid #25313e;border-radius:14px;padding:18px;min-width:0}
.studio-metric-label{display:flex;align-items:center;gap:10px;color:#c0cddd;font-size:14px}
.studio-metric-icon{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;font-size:20px;color:#fff}
.studio-metric-value{font-size:28px;font-weight:700;margin:14px 0 7px}
.studio-metric-foot{font-size:12px;color:#8fa1b6}
.studio-content-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:22px;align-items:start}
.studio-panel{background:#141d27;border:1px solid #25313e;border-radius:14px;padding:20px;margin-bottom:20px;min-width:0}
.studio-panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.studio-panel h3{font-size:19px;margin:0;color:#f3f6fb}
.studio-link{color:#6ba3ff;background:none;border:0;padding:4px;font-weight:600}
.studio-video{display:grid;grid-template-columns:144px minmax(0,1fr) 20px;gap:16px;padding:12px 0;border-bottom:1px solid #26323e;align-items:center}
.studio-video:last-child{border-bottom:0;padding-bottom:0}
.studio-thumb{height:86px;border-radius:8px;background:linear-gradient(135deg,#745331,#d6b77b 48%,#3b2b1d);display:grid;place-items:center;color:#fff;font-size:32px;position:relative;overflow:hidden}
.studio-thumb.bed{background:linear-gradient(135deg,#b7a48c,#45362b 50%,#e1d3bc)}
.studio-thumb.sofa{background:linear-gradient(135deg,#bcb8b1,#6c6258 55%,#e8dfd2)}
.studio-thumb.dining{background:linear-gradient(135deg,#bda26d,#59432c 55%,#dfd1b1)}
.studio-thumb span{position:absolute;right:6px;bottom:6px;background:#090d12dd;padding:3px 5px;border-radius:4px;font-size:11px}
.studio-video-title{font-size:14px;line-height:1.4;margin-bottom:7px;color:#e8eef6}
.studio-video-meta{font-size:12px;color:#8295aa;margin-bottom:10px}
.studio-video-stats{display:flex;gap:18px;flex-wrap:wrap;color:#b1c0d1;font-size:12px}
.studio-more{color:#9aabbe;background:none;border:0;font-size:18px}
.studio-big-number{font-size:30px;font-weight:700;margin:6px 0}
.studio-positive{font-size:12px;color:#35d477}
.studio-divider{height:1px;background:#283441;margin:18px 0}
.studio-topcontent{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:13px}
.studio-mini-thumb{width:54px;height:36px;border-radius:5px;background:linear-gradient(135deg,#bca06d,#57402b);display:grid;place-items:center}
.studio-topcontent .studio-number{margin-left:auto;color:#dce5ef}
.studio-comment{display:grid;grid-template-columns:34px minmax(0,1fr) 50px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #283441}
.studio-comment:last-child{border-bottom:0}
.studio-comment-avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#6752cc;color:#fff;font-weight:bold}
.studio-comment p{font-size:12px;line-height:1.5;margin:4px 0;color:#e2e8f0}
.studio-comment small{font-size:11px;color:#91a2b6}
.studio-news{display:flex;gap:12px;align-items:center;color:#c4d0de;font-size:13px;padding:15px 0 2px}
.studio-news-icon{background:#ff0033;color:#fff;border-radius:6px;padding:5px 7px}
.studio-approval{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.studio-main .action{background:#222f3d;border-color:#40536a}
.studio-main .action.active{background:#dce8ff;color:#142031}
.studio-main .warning{margin-top:12px}
.studio-main .page h2{color:#f8fafc}
.studio-main input,.studio-main select{color:#eef3ff}
@media(max-width:1050px){.studio-nav{width:215px}.studio-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.studio-content-grid{grid-template-columns:1fr}.studio-brand{min-width:170px}}
@media(max-width:680px){.studio-top{height:62px;padding:0 12px;gap:9px}.studio-brand{min-width:0;font-size:18px}.studio-brand .studio-mark{width:32px;height:24px}.studio-search{display:none}.studio-top-right{gap:10px}.studio-shell{display:block}.studio-nav{width:100%;display:flex;overflow-x:auto;gap:4px;padding:8px;border-right:0;border-bottom:1px solid #25313e}.studio-channel{display:none}.studio-nav .studio-navbtn{width:auto;min-width:max-content;margin:0;padding:10px 12px}.studio-nav-icon{width:auto}.studio-main{padding:18px 12px 32px}.studio-pagehead{align-items:flex-start;flex-direction:column}.studio-pagehead h2{font-size:24px}.studio-period{padding:9px 12px}.studio-metrics{gap:10px}.studio-metric{padding:14px}.studio-metric-value{font-size:24px}.studio-metric-label{font-size:12px}.studio-metric-icon{width:32px;height:32px}.studio-panel{padding:15px}.studio-video{grid-template-columns:100px minmax(0,1fr) 14px;gap:10px}.studio-thumb{height:70px;font-size:25px}.studio-video-title{font-size:12px}.studio-video-stats{gap:10px}.studio-content-grid{display:block}}

</style>
<style>
.studio-mark{display:none!important}
.studio-brand{min-width:150px!important}
.studio-brand:after{content:"";display:none}
.studio-top-right{gap:16px}
.top-icon-btn{width:40px;height:40px;border:0;border-radius:50%;display:grid;place-items:center;background:transparent;color:#dbe6f5;font-size:23px;position:relative}
.top-icon-btn:hover{background:#253446}
.top-add-btn{background:#172b43;border:1px solid #2e4968;color:#e8f2ff;font-size:25px}
.top-profile-btn{width:34px;height:34px;font-size:15px;background:#2449bc;color:white}
.studio-top{position:sticky}
.top-popover{position:absolute;top:62px;right:72px;width:270px;max-width:calc(100vw - 24px);background:#111d2a;border:1px solid #2c3b4c;border-radius:15px;box-shadow:0 14px 40px #0008;padding:10px;z-index:100}
.top-popover[hidden]{display:none}
.top-popover-head{padding:12px;border-bottom:1px solid #2a3948;margin-bottom:6px;color:#edf4ff}
.top-popover-head small{display:block;color:#93a7bd;margin-top:4px}
.top-popover button,.top-popover a{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:8px;background:transparent;color:#e0eaf6;text-decoration:none;text-align:left;font-size:14px}
.top-popover button:hover,.top-popover a:hover{background:#223144}
.top-popover .pop-divider{height:1px;background:#293847;margin:6px 2px}
@media(max-width:680px){.studio-brand{font-size:18px!important}.studio-top-right{gap:5px}.top-icon-btn{width:34px;height:36px}.top-popover{top:56px;right:8px}}
</style>
<style>
/* Mobile Studio bottom navigation and reliable hamburger drawer */
.studio-menu{cursor:pointer;position:relative;z-index:120;min-width:38px;min-height:38px;display:grid;place-items:center;border-radius:8px}
.studio-menu:hover{background:#263442}
@media(min-width:681px){
 .studio-nav.nav-expanded{width:248px}
}
@media(max-width:680px){
 body{padding-bottom:72px}
 .studio-shell{display:block;min-height:auto}
 .studio-nav{position:fixed;z-index:110;top:62px;bottom:0;left:0;width:min(290px,84vw);height:auto;display:flex;flex-direction:column;align-items:stretch;overflow-y:auto;overflow-x:hidden;gap:4px;padding:14px 10px 24px;background:#0e151d;border-right:1px solid #2b3948;box-shadow:12px 0 32px #0008;transform:translateX(-110%);visibility:hidden;transition:transform .2s ease,visibility .2s ease}
 .studio-nav.nav-expanded{transform:translateX(0);visibility:visible}
 .studio-nav .studio-channel{display:flex}
 .studio-nav .studio-navbtn{width:100%;min-width:0;flex-shrink:0}
 .studio-main{padding:16px 12px 26px}

}

</style>
<style>
/* NextGen duplicate dashboard polish: accessible, responsive, approval-first */
:root{--ng-blue:#168bff;--ng-cyan:#12d7f4;--ng-green:#00d99a;--ng-purple:#a855f7;--ng-amber:#ffb020}
body{background:radial-gradient(ellipse at 55% -12%,#123a67 0%,#07172c 42%,#050d1b 100%)!important;color:#edf5ff}
.studio-top{background:rgba(4,18,37,.96)!important;border-bottom-color:#164a79!important;backdrop-filter:blur(14px)}
.studio-brand{color:#f5f9ff!important;letter-spacing:.1px}
.studio-brand:before{content:none;display:none}
.studio-nav{background:rgba(3,16,32,.88)!important;border-right-color:#123657!important}
.studio-nav .studio-navbtn{transition:background .18s ease,color .18s ease}
.studio-nav .studio-navbtn.active,.studio-nav .studio-navbtn[aria-current=page]{background:linear-gradient(100deg,#0755a7,#0b3970)!important;color:#fff!important;box-shadow:inset 3px 0 #18caff}
.studio-main{background:transparent}
.studio-panel,.studio-metric,.studio-note,.studio-video,.studio-top-right .top-popover{border-color:#17436c!important;box-shadow:0 10px 30px #0002}
.studio-panel{background:linear-gradient(145deg,#081f3a,#06172c)!important;border-radius:15px}
.studio-metric{background:linear-gradient(145deg,#0c2440,#08162a)!important;border-radius:14px;transition:transform .18s ease,border-color .18s ease}
.studio-metric:hover{transform:translateY(-2px);border-color:#2588d5!important}
.studio-metric-value{letter-spacing:-.5px}
.studio-main .action{border-color:#28547c;background:#102b48;color:#f2f8ff}
.studio-main .action.active{background:linear-gradient(110deg,#0d9eff,#1764f5);color:white;border-color:#279fff}
.studio-main input:focus,.studio-main select:focus,.studio-search:focus{outline:2px solid #13b9f4;outline-offset:2px}
.studio-main .warning{background:#302516;border-color:#8d6927;color:#ffe2a6}
.ng-bottom-nav{background:rgba(3,14,29,.97)!important;border-top-color:#1a4d76!important}
.ng-bottom-nav a.active{background:#0c4e87!important;color:#fff!important}
body>footer{background:#071b32!important;border-top-color:#17436c!important}
@media(max-width:680px){.studio-top{gap:8px}.studio-brand{font-size:17px!important}.studio-brand:before{display:none}.studio-top-right{gap:5px}.studio-avatar{width:32px;height:32px}.studio-main{padding-top:13px}.studio-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.studio-panel{border-radius:12px}.ng-bottom-nav{padding-bottom:calc(8px + env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>

<body>
<header aria-label="NextGen header">
  <div class="brand">
    <div class="brand-name"><span>N</span>extGen</div>

  </div>
</header>
<main aria-label="Content Queue page"></main>
<footer>
  <span>NextGen • Smart Automation. Smarter Growth.</span>

</footer>
</body>
</html>
