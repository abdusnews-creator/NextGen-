<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">
<title>NextGen Content Queue</title>
<style>
:root{--bg:#0b1020;--line:#35547e;--text:#eef3ff;--muted:#c5d9ff;--accent:#00BFFF}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;min-height:76px;padding:16px 22px;background:linear-gradient(110deg,#10213f,#173b70 58%,#102544);border-bottom:1px solid var(--line);box-shadow:0 5px 22px #0004}
.brand{display:flex;flex-direction:column;gap:4px;line-height:1.1}
.brand-name{font-size:26px;font-weight:800;letter-spacing:.75px;color:#f4f7ff}
.brand-name span{color:var(--accent)}
.tagline{font-size:12px;font-weight:700;letter-spacing:.2px;color:var(--muted)}
main{flex:1;min-height:45vh}
footer{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:16px 20px calc(16px + env(safe-area-inset-bottom));margin-top:auto;color:var(--muted);background:linear-gradient(110deg,#10213f,#173b70 58%,#102544);border-top:1px solid var(--line);font-size:13px;font-weight:700}
footer .credit{font-size:11px;font-weight:600;color:#d4e2ff;text-align:right}
@media(max-width:480px){header{padding:15px 16px}.brand-name{font-size:24px}footer{padding-left:14px;padding-right:14px;flex-direction:column;align-items:flex-start}.credit{text-align:left}}
</style>
</head>
<body>
<header aria-label="NextGen header">
  <div class="brand">
    <div class="brand-name"><span>N</span>extGen</div>
    <div class="tagline">Smart Automation. Smarter Growth.</div>
  </div>
</header>
<main aria-label="Content Queue page"></main>
<footer>
  <span>NextGen • Smart Automation. Smarter Growth.</span>
  <span class="credit">Powered by ABDUS SATTAR</span>
</footer>
</body>
</html>
