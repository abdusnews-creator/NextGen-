name: Deploy NextGen backend functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out NextGen
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy authenticated backend functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing repository secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
          supabase link --project-ref vexntvbufnawtxszslsz
          supabase functions deploy channel-profile-lookup --project-ref vexntvbufnawtxszslsz
          supabase functions deploy platform-connection-status --project-ref vexntvbufnawtxszslsz
