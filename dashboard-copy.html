<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">
<title>NextGen Dashboard Copy</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 55% -12%,#123a67 0%,#07172c 42%,#050d1b 100%);color:#edf5ff;font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column}
header{min-height:72px;padding:14px 22px;background:linear-gradient(110deg,#07182c 0%,#0b2442 65%,#103b65 100%);border-bottom:1px solid #1675bd;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 5px 22px #0004}
.brand{display:flex;flex-direction:column;gap:3px}
.brand-name{font-size:22px;font-weight:800;letter-spacing:.75px}
.brand-name span{color:#00BFFF}
.tagline{font-size:10px;font-weight:700;color:#aabbd0}
.credit{font-size:11px;color:#d4e2ff;text-align:right}
main{flex:1;min-height:35vh}
footer{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 18px calc(14px + env(safe-area-inset-bottom));margin-top:24px;color:#c5d9ff;background:linear-gradient(110deg,#10213f,#173b70 58%,#102544);border-top:1px solid #35547e;font-size:12px}
footer .credit{font-size:11px}
@media(max-width:480px){header{padding:14px} .brand-name{font-size:20px} footer{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-name"><span>N</span>extGen</div>
    <div class="tagline">Smart Automation. Smarter Growth.</div>
  </div>
  <div class="credit">Powered by ABDUS SATTAR</div>
</header>
<main></main>
<footer>
  <span>NextGen Prototype • Dashboard preview</span>
  <span class="credit">Powered by ABDUS SATTAR</span>
</footer>
</body>
</html>
